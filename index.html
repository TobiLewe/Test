<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prüfungsfragen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Prüfungsfragen</h1>

    <div class="quiz-buttons">
      <button type="button" class="quiz-button" data-quiz="0">Quiz 1</button>
      <button type="button" class="quiz-button" data-quiz="1">Quiz 2</button>
      <button type="button" class="quiz-button" data-quiz="2">Quiz 3</button>
    </div>

    <div class="quiz-layout">
      <aside class="fragen-index">
        <h2>Fragen</h2>

        <div class="lernstatus">
          <div class="lernstatus-kopf">
            <span>Lernfortschritt</span>
            <strong id="lernfortschritt">0 / 13</strong>
          </div>
          <div class="fortschrittsbalken" aria-hidden="true">
            <div id="fortschrittsbalken"></div>
          </div>
          <div class="lernstatus-zahlen">
            <span id="offeneFragen">13 offen</span>
            <span id="gelernteFragen">0 gelernt</span>
          </div>
        </div>

        <div class="listen-werkzeuge">
          <div class="filter-buttons" role="group" aria-label="Fragen filtern">
            <button type="button" class="filter-button aktiv" data-filter="alle">Alle</button>
            <button type="button" class="filter-button" data-filter="offen">Offen</button>
            <button type="button" class="filter-button" data-filter="gelernt">Gelernt</button>
          </div>
          <label class="sortierung">
            Sortierung
            <select id="sortierung">
              <option value="nummer">Fragenreihenfolge</option>
              <option value="offen">Offene zuerst</option>
              <option value="gelernt">Gelernte zuerst</option>
              <option value="thema">Nach Thema</option>
            </select>
          </label>
        </div>

        <button type="button" id="naechsteOffene">Nächste offene Frage</button>
        <div id="fragenListe"></div>
        <button type="button" id="fragenZuruecksetzen">Markierungen zurücksetzen</button>
      </aside>

      <div class="card">
        <div id="fortschritt">Frage 1 von 13</div>
        <h2 id="frage"></h2>

        <div id="antwort" class="antwort"></div>

        <div class="aktionen">
          <button type="button" id="antwortButton">Antwort anzeigen</button>
          <button type="button" id="zurueckButton">Vorherige Frage</button>
          <button type="button" id="weiterButton">Nächste Frage</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
